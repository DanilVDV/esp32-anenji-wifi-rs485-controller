name: Promote datalogger integration v0.15.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-datalogger-v0151.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch firmware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino')
          s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              if old not in s: raise SystemExit('anchor missing: '+label)
              s=s.replace(old,new,1)
          once('#include <WiFi.h>\n','#include <WiFi.h>\n#include <WiFiUdp.h>\n','WiFi include')
          once('const char* FW_VERSION = "0.15.0";\nconst char* FW_VERSION_PREVIOUS = "0.14.31";','const char* FW_VERSION = "0.15.1";\nconst char* FW_VERSION_PREVIOUS = "0.15.0";','version')
          once('void handleEvents();\n','''void handleEvents();
void handleDataloggerStatus();
void handleDataloggerServiceApStart();
void handleDataloggerConnect();
void handleDataloggerRestore();
void handleDataloggerInfo();
void handleDataloggerPing();
void handleDataloggerSetParam();
''','prototypes')
          once('WebServer web(80);\n','''WebServer web(80);

const uint16_t DATALOGGER_UDP_PORT = 58899;
const uint16_t DATALOGGER_TCP_PORT = 8899;
WiFiUDP dataloggerUdp;
WiFiServer dataloggerServer(DATALOGGER_TCP_PORT);
bool dataloggerServiceMode = false;
String dataloggerLastTarget;
String dataloggerLastInfo;
uint32_t dataloggerLastOkMs = 0;
''','globals')
          network_anchor='// ---------------- Network / provisioning API ----------------\n'
          datalogger_code=r'''
// ---------------- EyeBond / SmartESS datalogger service ----------------
static uint16_t dlBe16(const uint8_t* p) { return ((uint16_t)p[0] << 8) | p[1]; }
static void dlPut16(uint8_t* p, uint16_t v) { p[0]=(uint8_t)(v>>8); p[1]=(uint8_t)v; }
bool dlWaitBytes(WiFiClient& c, uint8_t* dst, size_t len, uint32_t timeoutMs) { size_t got=0; uint32_t started=millis(); while(got<len && (uint32_t)(millis()-started)<timeoutMs) { while(c.available() && got<len) { int v=c.read(); if(v>=0) dst[got++]=(uint8_t)v; } if(!c.connected() && !c.available()) break; feedTaskWatchdog(); delay(2); } return got==len; }
bool dlWriteFrame(WiFiClient& c, uint16_t tid, uint8_t fcode, const uint8_t* body, size_t bodyLen) { if(bodyLen>240) return false; uint8_t frame[248]; dlPut16(frame,tid); dlPut16(frame+2,1); dlPut16(frame+4,(uint16_t)(bodyLen+2)); frame[6]=0xff; frame[7]=fcode; if(bodyLen) memcpy(frame+8,body,bodyLen); return c.write(frame,bodyLen+8)==bodyLen+8; }
bool dlReadFrame(WiFiClient& c, uint8_t expectedFcode, uint8_t* body, size_t bodyCap, size_t& bodyLen, String& err, uint32_t timeoutMs=1800) { uint8_t h[8]; bodyLen=0; if(!dlWaitBytes(c,h,sizeof(h),timeoutMs)){err="TCP response header timeout";return false;} uint16_t wireLen=dlBe16(h+4); if(wireLen<2){err="Invalid datalogger frame length";return false;} bodyLen=wireLen-2; if(bodyLen>bodyCap){err="Datalogger frame too large";return false;} if(h[7]!=expectedFcode){err=String("Unexpected function code ")+h[7];return false;} if(bodyLen && !dlWaitBytes(c,body,bodyLen,timeoutMs)){err="TCP response body timeout";return false;} return true; }
bool dlTargetFromBody(const String& body, IPAddress& target, String& targetText, String& err) { targetText=""; jsonFindString(body,"ip",targetText); if(!targetText.length() && dataloggerServiceMode) targetText=WiFi.gatewayIP().toString(); if(!targetText.length()){err="Datalogger IP required";return false;} if(!target.fromString(targetText)){err="Invalid datalogger IP";return false;} return true; }
bool dlOpenSession(IPAddress target, WiFiClient& client, String& err) { if(WiFi.status()!=WL_CONNECTED){err="ESP32 STA is not connected";return false;} IPAddress local=WiFi.localIP(); if(local.toString()=="0.0.0.0"){err="ESP32 has no STA IP";return false;} dataloggerServer.begin(); dataloggerServer.setNoDelay(true); dataloggerUdp.stop(); if(!dataloggerUdp.begin(0)){err="UDP start failed";return false;} String cmd=String("set>server=")+local.toString()+":"+String(DATALOGGER_TCP_PORT)+";"; if(!dataloggerUdp.beginPacket(target,DATALOGGER_UDP_PORT)){err="UDP beginPacket failed";return false;} dataloggerUdp.write((const uint8_t*)cmd.c_str(),cmd.length()); if(!dataloggerUdp.endPacket()){err="UDP send failed";return false;} String rsp; uint32_t started=millis(); while((uint32_t)(millis()-started)<5000UL){ int n=dataloggerUdp.parsePacket(); if(n>0){ while(n-- > 0){int ch=dataloggerUdp.read(); if(ch>=0) rsp+=(char)ch;} break; } feedTaskWatchdog(); delay(5); } if(!rsp.startsWith("rsp>server=")){err=String("Unexpected UDP reply: ")+rsp;return false;} started=millis(); while((uint32_t)(millis()-started)<5000UL){ WiFiClient c=dataloggerServer.available(); if(c){ client=c; client.setNoDelay(true); dataloggerLastTarget=target.toString(); return true; } feedTaskWatchdog(); delay(5); } err="Datalogger did not connect to TCP 8899"; return false; }
void dlCloseSession(WiFiClient& c) { if(c) c.stop(); dataloggerUdp.stop(); }
String dlInfoJson(IPAddress target, String& err) { WiFiClient c; if(!dlOpenSession(target,c,err)) return ""; const uint8_t pars[]={1,2,5,6,7,11,12,48,3,4,14,34,41}; if(!dlWriteFrame(c,1,2,pars,sizeof(pars))){err="Info request write failed";dlCloseSession(c);return "";} String j="{\"ok\":true,\"ip\":\""+target.toString()+"\",\"params\":{"; bool first=true; for(size_t i=0;i<sizeof(pars);++i){ uint8_t b[220];size_t n=0; if(!dlReadFrame(c,2,b,sizeof(b),n,err)){dlCloseSession(c);return "";} if(n<2){err="Short info response";dlCloseSession(c);return "";} uint8_t par=b[1]; String val; for(size_t k=2;k<n;++k) val+=(char)b[k]; if(!first)j+=',';first=false; j+='"';j+=par;j+=F("\":\"");j+=jsonEscape(val);j+='"'; } j+=F("}}"); dlCloseSession(c); dataloggerLastInfo=j; dataloggerLastOkMs=millis(); return j; }
void handleDataloggerStatus(){ String j=F("{\"ok\":true,\"experimental\":true,\"service_mode\":");j+=dataloggerServiceMode?F("true"):F("false"); j+=F(",\"sta_connected\":");j+=(WiFi.status()==WL_CONNECTED)?F("true"):F("false"); j+=F(",\"sta_ssid\":\"");j+=jsonEscape(WiFi.SSID());j+='"'; j+=F(",\"sta_ip\":\"");j+=WiFi.localIP().toString();j+='"'; j+=F(",\"gateway\":\"");j+=WiFi.gatewayIP().toString();j+='"'; j+=F(",\"service_ap_running\":");j+=setupApRunning?F("true"):F("false"); j+=F(",\"service_ap_ip\":\"");j+=WiFi.softAPIP().toString();j+='"'; j+=F(",\"last_target\":\"");j+=jsonEscape(dataloggerLastTarget);j+='"'; j+=F(",\"last_ok_age_ms\":");j+=dataloggerLastOkMs?(uint32_t)(millis()-dataloggerLastOkMs):0; j+='}';sendJson(200,j); }
void handleDataloggerServiceApStart(){ if(!adminAuthorized()){sendJson(401,F("{\"ok\":false,\"error\":\"Admin authorization required\"}"));return;} WiFi.mode(WIFI_AP_STA); if(!setupApRunning){ WiFi.softAPConfig(SETUP_AP_IP,SETUP_AP_GW,SETUP_AP_MASK); setupApRunning=WiFi.softAP(setupApSsid.c_str(),setupApPassword.c_str()); } if(!setupApRunning){sendJson(500,F("{\"ok\":false,\"error\":\"Service AP start failed\"}"));return;} String j=F("{\"ok\":true,\"ssid\":\"");j+=jsonEscape(setupApSsid);j+=F("\",\"password\":\"");j+=jsonEscape(setupApPassword); j+=F("\",\"ip\":\"");j+=WiFi.softAPIP().toString();j+=F("\",\"note\":\"Connect to this AP before switching ESP32 STA to the datalogger AP\"}");sendJson(200,j); }
void handleDataloggerConnect(){ if(!adminAuthorized()){sendJson(401,F("{\"ok\":false,\"error\":\"Admin authorization required\"}"));return;} if(!setupApRunning){sendJson(409,F("{\"ok\":false,\"error\":\"Start service AP first\"}"));return;} String body=web.arg("plain"),ssid,pass; if(!jsonFindString(body,"ssid",ssid)||!ssid.length()){sendJson(400,F("{\"ok\":false,\"error\":\"ssid required\"}"));return;} jsonFindString(body,"password",pass); WiFi.mode(WIFI_AP_STA); WiFi.disconnect(false,false); delay(100); WiFi.begin(ssid.c_str(),pass.c_str()); uint32_t started=millis();while(WiFi.status()!=WL_CONNECTED && (uint32_t)(millis()-started)<15000UL){feedTaskWatchdog();delay(100);} if(WiFi.status()!=WL_CONNECTED){sendJson(504,F("{\"ok\":false,\"error\":\"Could not connect to datalogger AP; service AP remains active\"}"));return;} dataloggerServiceMode=true; String j=F("{\"ok\":true,\"sta_ip\":\"");j+=WiFi.localIP().toString();j+=F("\",\"datalogger_ip\":\"");j+=WiFi.gatewayIP().toString();j+=F("\"}");sendJson(200,j); }
void handleDataloggerRestore(){ if(!adminAuthorized()){sendJson(401,F("{\"ok\":false,\"error\":\"Admin authorization required\"}"));return;} dataloggerServiceMode=false; WiFi.disconnect(false,false); delay(100); if(wifiSsid.length()) WiFi.begin(wifiSsid.c_str(),wifiPass.c_str()); sendJson(202,F("{\"ok\":true,\"restoring\":true,\"note\":\"ESP32 STA is reconnecting to saved home Wi-Fi; service AP remains available during recovery\"}")); }
void handleDataloggerInfo(){ String body=web.arg("plain"),err,targetText;IPAddress target; if(!dlTargetFromBody(body,target,targetText,err)){sendJson(400,String("{\"ok\":false,\"error\":\"")+jsonEscape(err)+"\"}");return;} String j=dlInfoJson(target,err);if(!j.length()){sendJson(502,String("{\"ok\":false,\"error\":\"")+jsonEscape(err)+"\"}");return;}sendJson(200,j); }
void handleDataloggerPing(){ String body=web.arg("plain"),err,targetText;IPAddress target; if(!dlTargetFromBody(body,target,targetText,err)){sendJson(400,String("{\"ok\":false,\"error\":\"")+jsonEscape(err)+"\"}");return;} WiFiClient c;if(!dlOpenSession(target,c,err)){sendJson(502,String("{\"ok\":false,\"error\":\"")+jsonEscape(err)+"\"}");return;} time_t now=time(nullptr);struct tm t={};gmtime_r(&now,&t);uint8_t b[8]; b[0]=(uint8_t)((t.tm_year+1900-2000)&0xff);b[1]=(uint8_t)(t.tm_mon+1);b[2]=(uint8_t)t.tm_mday;b[3]=(uint8_t)t.tm_hour;b[4]=(uint8_t)t.tm_min;b[5]=(uint8_t)t.tm_sec;dlPut16(b+6,300); if(!dlWriteFrame(c,0xbeef,1,b,sizeof(b))){err="Ping write failed";dlCloseSession(c);sendJson(502,String("{\"ok\":false,\"error\":\"")+jsonEscape(err)+"\"}");return;} uint8_t r[220];size_t n=0;if(!dlReadFrame(c,1,r,sizeof(r),n,err,1200)){dlCloseSession(c);sendJson(502,String("{\"ok\":false,\"error\":\"")+jsonEscape(err)+"\"}");return;} String hex;const char* hd="0123456789abcdef";for(size_t i=0;i<n;++i){hex+=hd[r[i]>>4];hex+=hd[r[i]&15];} dlCloseSession(c);dataloggerLastOkMs=millis();sendJson(200,String("{\"ok\":true,\"response_hex\":\"")+hex+"\"}"); }
void handleDataloggerSetParam(){ if(!adminAuthorized()){sendJson(401,F("{\"ok\":false,\"error\":\"Admin authorization required\"}"));return;} String body=web.arg("plain"),name,value,err,targetText;IPAddress target; if(!jsonFindString(body,"name",name)||!jsonFindString(body,"value",value)){sendJson(400,F("{\"ok\":false,\"error\":\"name/value required\"}"));return;} uint8_t par=0;if(name=="ssid")par=41;else if(name=="password")par=43;else if(name=="restart")par=29;else{sendJson(400,F("{\"ok\":false,\"error\":\"Only ssid, password, restart are allowed\"}"));return;} if(!dlTargetFromBody(body,target,targetText,err)){sendJson(400,String("{\"ok\":false,\"error\":\"")+jsonEscape(err)+"\"}");return;} WiFiClient c;if(!dlOpenSession(target,c,err)){sendJson(502,String("{\"ok\":false,\"error\":\"")+jsonEscape(err)+"\"}");return;} uint8_t b[130];size_t n=1+value.length();if(n>sizeof(b)){dlCloseSession(c);sendJson(400,F("{\"ok\":false,\"error\":\"value too long\"}"));return;}b[0]=par;memcpy(b+1,value.c_str(),value.length()); if(!dlWriteFrame(c,1,3,b,n)){err="Set parameter write failed";dlCloseSession(c);sendJson(502,String("{\"ok\":false,\"error\":\"")+jsonEscape(err)+"\"}");return;} uint8_t r[16];size_t rn=0;if(!dlReadFrame(c,3,r,sizeof(r),rn,err)){dlCloseSession(c);sendJson(502,String("{\"ok\":false,\"error\":\"")+jsonEscape(err)+"\"}");return;} dlCloseSession(c);if(rn<2){sendJson(502,F("{\"ok\":false,\"error\":\"short set-param response\"}"));return;} String j=F("{\"ok\":");j+=(r[0]==0)?F("true"):F("false");j+=F(",\"status\":");j+=r[0];j+=F(",\"param\":");j+=r[1];j+=F("}");sendJson(200,j); }

'''
          once(network_anchor,datalogger_code+network_anchor,'network anchor')
          card=r'''<div class="card"><h2>Datalogger</h2>
<div class="small">Экспериментальное управление штатным EyeBond / SmartESS Wi-Fi datalogger. ESP32 не выполняет никаких действий автоматически.</div>
<div class="grid" style="margin-top:10px"><label>IP datalogger<input id="dlIp" placeholder="например 192.168.1.50"></label><label>SSID точки datalogger<input id="dlApSsid" placeholder="Q00... / W00..."></label><label>Пароль точки datalogger<input id="dlApPass" type="password" placeholder="пароль AP"></label></div>
<div class="toolbar" style="margin-top:10px"><button onclick="dlServiceAp()">1. Сервисная AP ESP32</button><button onclick="dlConnectAp()">2. Подключиться к AP datalogger</button><button onclick="dlRestore()">Вернуть домашний Wi-Fi</button></div><div id="dlStatus" class="small" style="margin-top:8px">—</div><div class="toolbar" style="margin-top:10px"><button onclick="dlInfo()">Info</button><button onclick="dlPing()">Ping</button></div>
<details style="margin-top:10px"><summary>Изменение параметров datalogger</summary><div class="small" style="margin:8px 0">Команды подтверждены для SmartESS/EyeBond: STA SSID (41), STA password (43), restart (29). Это не пароль собственной AP datalogger.</div><div class="grid"><label>Новый STA SSID<input id="dlStaSsid"></label><label>Новый STA пароль<input id="dlStaPass" type="password"></label></div><div class="toolbar" style="margin-top:8px"><button onclick="dlSet('ssid')">Записать STA SSID</button><button onclick="dlSet('password')">Записать STA пароль</button><button onclick="dlRestart()">Restart datalogger</button></div></details><pre id="dlOut" style="white-space:pre-wrap;max-height:260px;overflow:auto"></pre></div>
'''
          conn='<div class="card"><h2>Связь</h2>\n'
          if conn not in s: raise SystemExit('connection card anchor missing')
          s=s.replace(conn,card+'\n'+conn,1)
          js=r'''
async function dlReq(path,body={},admin=false){const h={'Content-Type':'application/json'};if(admin){const p=prompt(currentLang==='ru'?'Пароль администратора ESP32':'ESP32 admin password');if(p===null)throw new Error('cancelled');h['X-ANENJI-Admin']=p;}const r=await fetch(path,{method:'POST',headers:h,body:JSON.stringify(body)});let x={};try{x=await r.json();}catch(e){}if(!r.ok||x.ok===false)throw new Error(x.error||('HTTP '+r.status));return x;}
function dlTarget(){return ($('dlIp').value||'').trim();} function dlShow(x){$('dlOut').textContent=JSON.stringify(x,null,2);}
async function dlStatus(){try{const r=await fetch('/api/datalogger/status',{cache:'no-store'}),x=await r.json();$('dlStatus').textContent=`STA: ${x.sta_ssid||'—'} ${x.sta_ip||''} | gateway ${x.gateway||'—'} | service AP ${x.service_ap_running?'ON':'OFF'}`;if(x.service_mode&&x.gateway&&!dlTarget())$('dlIp').value=x.gateway;}catch(e){}}
async function dlServiceAp(){try{const x=await dlReq('/api/datalogger/service-ap/start',{},true);dlShow(x);alert(`Подключитесь к Wi-Fi ${x.ssid}\nПароль: ${x.password}\nОткройте http://${x.ip}`);dlStatus();}catch(e){alert(e.message)}} async function dlConnectAp(){try{const x=await dlReq('/api/datalogger/connect',{ssid:$('dlApSsid').value,password:$('dlApPass').value},true);dlShow(x);if(x.datalogger_ip)$('dlIp').value=x.datalogger_ip;dlStatus();}catch(e){alert(e.message)}} async function dlRestore(){try{dlShow(await dlReq('/api/datalogger/restore',{},true));}catch(e){alert(e.message)}} async function dlInfo(){try{dlShow(await dlReq('/api/datalogger/info',{ip:dlTarget()}));}catch(e){alert(e.message)}} async function dlPing(){try{dlShow(await dlReq('/api/datalogger/ping',{ip:dlTarget()}));}catch(e){alert(e.message)}} async function dlSet(name){const v=name==='ssid'?$('dlStaSsid').value:$('dlStaPass').value;if(!confirm('Записать параметр '+name+' в datalogger?'))return;try{dlShow(await dlReq('/api/datalogger/set',{ip:dlTarget(),name:name,value:v},true));}catch(e){alert(e.message)}} async function dlRestart(){if(!confirm('Перезапустить datalogger?'))return;try{dlShow(await dlReq('/api/datalogger/set',{ip:dlTarget(),name:'restart',value:'1'},true));}catch(e){alert(e.message)}} setInterval(dlStatus,5000);setTimeout(dlStatus,1200);
'''
          once('const TAB_RULES=[\n',js+'\nconst TAB_RULES=[\n','js')
          once(" ['Связь','service'],\n"," ['Связь','service'],['Datalogger','service'],\n",'tab mapping')
          route_anchor='  web.on("/api/events", HTTP_GET, handleEvents);\n'
          routes='''  web.on("/api/datalogger/status", HTTP_GET, handleDataloggerStatus);\n  web.on("/api/datalogger/service-ap/start", HTTP_POST, handleDataloggerServiceApStart);\n  web.on("/api/datalogger/connect", HTTP_POST, handleDataloggerConnect);\n  web.on("/api/datalogger/restore", HTTP_POST, handleDataloggerRestore);\n  web.on("/api/datalogger/info", HTTP_POST, handleDataloggerInfo);\n  web.on("/api/datalogger/ping", HTTP_POST, handleDataloggerPing);\n  web.on("/api/datalogger/set", HTTP_POST, handleDataloggerSetParam);\n'''
          once(route_anchor,routes+route_anchor,'routes')
          p.write_text(s,encoding='utf-8')
          print('patched',p,p.stat().st_size)
          PY

      - name: Validate markers and embedded JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino')
          s=p.read_text(encoding='utf-8')
          req=['const char* FW_VERSION = "0.15.1";','DATALOGGER_UDP_PORT = 58899','DATALOGGER_TCP_PORT = 8899','set>server=','handleDataloggerInfo','par=41','/api/datalogger/info','id="dlIp"',"['Datalogger','service']"]
          missing=[x for x in req if x not in s]
          if missing: raise SystemExit('missing '+repr(missing))
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          if not m: raise SystemExit('embedded JS not found')
          Path('/tmp/ui.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/ui.js

      - name: Commit firmware to main
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino
          git commit -m "Add experimental EyeBond datalogger service controls"
          git push origin HEAD:main

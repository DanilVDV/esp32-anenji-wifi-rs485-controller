name: Apply v0.15.9 Hall current sensor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0159-hall.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply firmware and README patch
        run: |
          python3 tools/promote_v0159.py patch
          python3 tools/promote_v0159.py readme
          python3 tools/promote_v0159.py validate
          node --check /tmp/embedded.js
          git diff --check

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compile ESP32 Dev Module
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/ANENJI_ESP32_Controller

      - name: Commit v0.15.9
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino README.md
          git commit -m "Add PZCT-DC63 current sensor via ADS1115"
          git push origin HEAD:main

      - name: Tag v0.15.9
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.15.9 >/dev/null 2>&1; then
            echo 'Tag v0.15.9 already exists; not moving it.'
          else
            git tag -a v0.15.9 -m 'ANENJI ESP32 v0.15.9'
            git push origin v0.15.9
          fi

name: Promote datalogger v0.15.1 to main

on:
  push:
    branches:
      - chatgpt/anenji-alerts-v0.15.0
    paths:
      - .github/workflows/promote-anenji-v015-main.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
          fetch-depth: 1

      - name: Checkout patch tools
        uses: actions/checkout@v4
        with:
          ref: chatgpt/anenji-alerts-v0.15.0
          path: patchsrc
          fetch-depth: 1

      - name: Apply datalogger patch
        run: python3 patchsrc/tools/apply_datalogger_v0_15_1.py base

      - name: Validate firmware markers and UI JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('base/firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino')
          s=p.read_text(encoding='utf-8')
          req=['const char* FW_VERSION = "0.15.1";','DATALOGGER_UDP_PORT = 58899','DATALOGGER_TCP_PORT = 8899','set>server=','handleDataloggerInfo','par=41','par=43','par=29','/api/datalogger/info','id="dlIp"',"['Datalogger','service']"]
          missing=[x for x in req if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          if not m: raise SystemExit('embedded JS not found')
          Path('/tmp/ui.js').write_text(m.group(1),encoding='utf-8')
          print('candidate bytes',p.stat().st_size)
          PY
          node --check /tmp/ui.js

      - name: Commit firmware to main
        working-directory: base
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino
          git commit -m "Add experimental EyeBond datalogger service controls"
          git push origin HEAD:main

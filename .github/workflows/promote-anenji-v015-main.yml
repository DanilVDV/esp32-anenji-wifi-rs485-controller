name: Promote power flow v0.15.4 to main

on:
  push:
    branches:
      - chatgpt/anenji-alerts-v0.15.0
    paths:
      - .github/workflows/promote-anenji-v015-main.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
          fetch-depth: 1

      - name: Checkout patch tools
        uses: actions/checkout@v4
        with:
          ref: chatgpt/anenji-alerts-v0.15.0
          path: patchsrc
          fetch-depth: 1

      - name: Apply power flow patch
        run: python3 patchsrc/tools/apply_powerflow_v0_15_4.py base

      - name: Validate power flow UI and embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('base/firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino')
          s=p.read_text(encoding='utf-8')
          req=[
            'const char* FW_VERSION = "0.15.4";',
            'data-page="power"',
            '<h2>Power Flow</h2>',
            "['Power Flow','power']",
            "['overview','power','battery','settings','scheduler','network','service']",
            'function renderPowerFlowCard(t)',
            "renderPowerFlowCard(t);",
            "gridOnline=!!pz.online",
            "classList.toggle('pf-hidden',!gridOnline)",
            '@keyframes pfMoveH',
            '@keyframes pfMoveV'
          ]
          missing=[x for x in req if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          forbidden=['WiFiUdp.h','DATALOGGER_UDP_PORT','dataloggerServiceMode','handleDatalogger','/api/datalogger/','<h2>Datalogger</h2>','async function dlReq']
          found=[x for x in forbidden if x in s]
          if found: raise SystemExit('Datalogger leftovers: '+repr(found))
          if s.count('id="pfBoard"') != 1: raise SystemExit('pfBoard duplicate/missing')
          if s.count('data-page="power"') != 1: raise SystemExit('power tab duplicate/missing')
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          if not m: raise SystemExit('embedded JS not found')
          Path('/tmp/ui.js').write_text(m.group(1),encoding='utf-8')
          print('candidate bytes',p.stat().st_size)
          PY
          node --check /tmp/ui.js

      - name: Commit firmware to main
        working-directory: base
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino
          git commit -m "Add dedicated EyeBond-style power flow tab"
          git push origin HEAD:main

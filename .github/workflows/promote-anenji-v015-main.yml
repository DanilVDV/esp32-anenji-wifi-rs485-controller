name: Fix scheduler tab routing on main

on:
  push:
    branches:
      - chatgpt/anenji-alerts-v0.15.0
    paths:
      - .github/workflows/promote-anenji-v015-main.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fix scheduler card routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino')
          s=p.read_text(encoding='utf-8')
          old_rule="['RTC / Планировщик','scheduler']"
          new_rule="['Время / Планировщик','scheduler']"
          old_tr="['RTC / Планировщик','RTC / Scheduler']"
          new_tr="['Время / Планировщик','Time / Scheduler']"
          for old,new,label in [(old_rule,new_rule,'TAB_RULES'),(old_tr,new_tr,'UI translation')]:
              if s.count(old)!=1:
                  raise SystemExit(f'{label}: expected exactly one old entry, got {s.count(old)}')
              s=s.replace(old,new,1)
          if 'const char* FW_VERSION = "0.15.5";' not in s or 'const char* FW_VERSION_PREVIOUS = "0.15.4";' not in s:
              raise SystemExit('unexpected firmware version')
          s=s.replace('const char* FW_VERSION = "0.15.5";','const char* FW_VERSION = "0.15.6";',1)
          s=s.replace('const char* FW_VERSION_PREVIOUS = "0.15.4";','const char* FW_VERSION_PREVIOUS = "0.15.5";',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate scheduler tab and embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino')
          s=p.read_text(encoding='utf-8')
          required=[
            'const char* FW_VERSION = "0.15.6";',
            '<div class="card"><h2>Время / Планировщик</h2>',
            "['Время / Планировщик','scheduler']",
            "['Время / Планировщик','Time / Scheduler']",
            "for(const id of ['overview','battery','settings','scheduler','network','service'])",
            "pages[page].appendChild(c);",
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          if "['RTC / Планировщик','scheduler']" in s:
              raise SystemExit('old scheduler routing rule still present')
          if s.count('<div class="card"><h2>Время / Планировщик</h2>') != 1:
              raise SystemExit('scheduler card count is not exactly one')
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          if not m: raise SystemExit('embedded JS not found')
          Path('/tmp/ui.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/ui.js

      - name: Commit firmware to main
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino
          git commit -m "Fix scheduler tab card routing"
          git push origin HEAD:main

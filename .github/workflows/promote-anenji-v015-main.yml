name: Promote ANENJI v0.15.7

on:
  push:
    branches:
      - chatgpt/anenji-alerts-v0.15.0
    paths:
      - .github/workflows/promote-anenji-v015-main.yml
      - tools/promote_v0157.py
      - tools/render_readme_ui_v0157.js
      - tools/refresh_readme_media_v0157.py

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Load v0.15.7 tools
        run: |
          git fetch origin chatgpt/anenji-alerts-v0.15.0
          git show origin/chatgpt/anenji-alerts-v0.15.0:tools/promote_v0157.py > /tmp/promote_v0157.py
          git show origin/chatgpt/anenji-alerts-v0.15.0:tools/render_readme_ui_v0157.js > /tmp/render_readme_ui_v0157.js
          git show origin/chatgpt/anenji-alerts-v0.15.0:tools/refresh_readme_media_v0157.py > /tmp/refresh_readme_media_v0157.py

      - name: Validate firmware and embedded JavaScript
        run: |
          python3 /tmp/promote_v0157.py validate
          node --check /tmp/embedded.js

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compile ESP32 firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/ANENJI_ESP32_Controller

      - name: Install README renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core

      - name: Render full-page Web UI media
        run: node /tmp/render_readme_ui_v0157.js

      - name: Refresh README media section
        run: |
          python3 /tmp/refresh_readme_media_v0157.py
          git diff --check

      - name: Commit README media refresh
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md docs/media
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "Use full-page screenshots and slower UI preview"
            git push origin HEAD:main
          fi

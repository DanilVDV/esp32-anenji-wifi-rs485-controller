name: Apply v0.15.8 event timestamps

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v0158-event-time.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Load patch
        run: |
          git fetch origin chatgpt/anenji-alerts-v0.15.0
          git show origin/chatgpt/anenji-alerts-v0.15.0:tools/promote_v0158.py > /tmp/promote_v0158.py
      - name: Patch
        run: python3 /tmp/promote_v0158.py patch
      - name: Validate JS
        run: |
          python3 /tmp/promote_v0158.py validate
          node --check /tmp/embedded.js
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/ANENJI_ESP32_Controller
      - name: Commit firmware
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino
          git commit -m "Add dated inverter event log"
          git push origin HEAD:main

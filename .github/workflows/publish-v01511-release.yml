name: Publish v0.15.11 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v01511-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean v0.15.11 source
        uses: actions/checkout@v4
        with:
          ref: d967de8315174c4aa49a7acc923c7f11b81997a5
          fetch-depth: 0

      - name: Verify firmware version
        run: grep -q 'const char\* FW_VERSION = "0.15.11";' firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino

      - name: Create v0.15.11 tag
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.15.11 >/dev/null 2>&1; then
            echo 'Tag v0.15.11 already exists'
          else
            git tag v0.15.11 d967de8315174c4aa49a7acc923c7f11b81997a5
            git push origin refs/tags/v0.15.11
          fi

      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino').read_text(encoding='utf-8')
          m=re.search(r'R"HTML\((.*?)\)HTML"',s,re.S)
          scripts=re.findall(r'<script>(.*?)</script>',m.group(1),re.S) if m else []
          if not scripts: raise SystemExit('embedded JavaScript not found')
          Path('/tmp/embedded.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/embedded.js

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compile v0.15.11 Minimal SPIFFS
        run: |
          mkdir -p build/release
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --output-dir build/release \
            firmware/ANENJI_ESP32_Controller

      - name: Prepare release files
        run: |
          cd build/release
          cp ANENJI_ESP32_Controller.ino.bin ANENJI_ESP32_Controller-v0.15.11.bin
          cp ANENJI_ESP32_Controller.ino.bootloader.bin ANENJI_ESP32_Controller-v0.15.11-bootloader.bin
          cp ANENJI_ESP32_Controller.ino.partitions.bin ANENJI_ESP32_Controller-v0.15.11-partitions.bin
          sha256sum ANENJI_ESP32_Controller-v0.15.11*.bin > SHA256SUMS-v0.15.11.txt

      - name: Create v0.15.11 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.15.11 >/dev/null 2>&1; then
            gh release upload v0.15.11 build/release/ANENJI_ESP32_Controller-v0.15.11*.bin build/release/SHA256SUMS-v0.15.11.txt --clobber
          else
            gh release create v0.15.11 \
              build/release/ANENJI_ESP32_Controller-v0.15.11.bin \
              build/release/ANENJI_ESP32_Controller-v0.15.11-bootloader.bin \
              build/release/ANENJI_ESP32_Controller-v0.15.11-partitions.bin \
              build/release/SHA256SUMS-v0.15.11.txt \
              --title 'ANENJI ESP32 v0.15.11' \
              --notes 'Persistent event archive: live overview remains uncluttered; evicted events are archived in LittleFS with 30-day / 64 KB retention, batching, rotation, repeat aggregation, Service-only archive controls and CSV export. Built with Minimal SPIFFS partition scheme.'
          fi

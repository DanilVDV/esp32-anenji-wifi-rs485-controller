name: Apply v0.15.10 full English localization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v01510-i18n.yml'

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply localization patch
        run: python3 tools/apply_v01510_i18n.py
      - name: Validate embedded JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino').read_text()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          if not m: raise SystemExit('script not found')
          Path('/tmp/ui.js').write_text(m.group(1))
          PY
          node --check /tmp/ui.js
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile ESP32 firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/ANENJI_ESP32_Controller
      - name: Commit v0.15.10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/ANENJI_ESP32_Controller/ANENJI_ESP32_Controller.ino
          git commit -m 'Release v0.15.10 complete English UI localization'
          git push origin HEAD:main

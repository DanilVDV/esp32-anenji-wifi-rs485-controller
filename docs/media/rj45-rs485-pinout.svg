<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#12325a">ANENJI RS-485 (BMS) — RJ45</text>
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="21" fill="#4a5568">Распиновка порта по таблице производителя + цвета стандартного кабеля T568B</text>

  <!-- RJ45 shell -->
  <rect x="55" y="145" width="500" height="340" rx="28" fill="#f2f5f8" stroke="#385b7b" stroke-width="4"/>
  <path d="M135 185 H475 V375 H430 L395 445 H215 L180 375 H135 Z" fill="#d9e2ea" stroke="#385b7b" stroke-width="4"/>
  <text x="305" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#334155">Вид на контакты разъёма</text>

  <!-- contacts -->
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <rect x="155" y="210" width="33" height="118" fill="#fff" stroke="#d97706" stroke-width="5"/>
    <rect x="193" y="210" width="33" height="118" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
    <rect x="231" y="210" width="33" height="118" fill="#fff" stroke="#16a34a" stroke-width="5"/>
    <rect x="269" y="210" width="33" height="118" fill="#2563eb"/>
    <rect x="307" y="210" width="33" height="118" fill="#fff" stroke="#2563eb" stroke-width="5"/>
    <rect x="345" y="210" width="33" height="118" fill="#16a34a"/>
    <rect x="383" y="210" width="33" height="118" fill="#fff" stroke="#92400e" stroke-width="5"/>
    <rect x="421" y="210" width="33" height="118" fill="#92400e"/>
    <g fill="#0f172a" font-weight="700">
      <text x="171" y="200">1</text><text x="209" y="200">2</text><text x="247" y="200">3</text><text x="285" y="200">4</text>
      <text x="323" y="200">5</text><text x="361" y="200">6</text><text x="399" y="200">7</text><text x="437" y="200">8</text>
    </g>
    <text x="171" y="355" fill="#b45309" font-weight="700">B</text>
    <text x="209" y="355" fill="#ea580c" font-weight="700">A</text>
    <text x="399" y="355" fill="#7c2d12" font-weight="700">A</text>
    <text x="437" y="355" fill="#7c2d12" font-weight="700">B</text>
  </g>

  <!-- table -->
  <rect x="610" y="145" width="535" height="365" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="640" y="185" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#12325a">Контакты и цвета T568B</text>
  <g font-family="Arial, sans-serif" font-size="21">
    <text x="645" y="230" font-weight="700" fill="#475569">Pin</text><text x="725" y="230" font-weight="700" fill="#475569">Провод</text><text x="985" y="230" font-weight="700" fill="#475569">RS-485</text>
    <line x1="630" y1="245" x2="1125" y2="245" stroke="#cbd5e1"/>
    <text x="650" y="282">1</text><text x="725" y="282" fill="#b45309">бело-оранжевый</text><text x="985" y="282" font-weight="700">B (RS485-B)</text>
    <text x="650" y="322">2</text><text x="725" y="322" fill="#ea580c">оранжевый</text><text x="985" y="322" font-weight="700">A (RS485-A)</text>
    <text x="650" y="362">3–6</text><text x="725" y="362" fill="#64748b">остальные пары</text><text x="985" y="362" fill="#64748b">не используются</text>
    <text x="650" y="402">7</text><text x="725" y="402" fill="#7c2d12">бело-коричневый</text><text x="985" y="402" font-weight="700">A (RS485-A)</text>
    <text x="650" y="442">8</text><text x="725" y="442" fill="#7c2d12">коричневый</text><text x="985" y="442" font-weight="700">B (RS485-B)</text>
  </g>

  <rect x="610" y="535" width="535" height="80" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="635" y="567" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a3412">Важно:</text>
  <text x="705" y="567" font-family="Arial, sans-serif" font-size="19" fill="#7c2d12">перед включением проверьте нумерацию контактов</text>
  <text x="635" y="595" font-family="Arial, sans-serif" font-size="19" fill="#7c2d12">конкретного кабеля мультиметром: ориентация вилки легко путается.</text>
</svg>
